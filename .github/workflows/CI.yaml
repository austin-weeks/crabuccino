name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  Run-Checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.25.0
          cache: true

      - name: Type Check
        run: pnpm run typecheck

      - name: Check Linting
        run: pnpm run lint

      - name: Check Formatting
        run: pnpm run format:check

      - name: Validate Build
        run: pnpm run build

  Run-Tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.25.0
          cache: true

      - name: Run Tests
        run: pnpm run test
